<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Portal - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f0f4f8; overflow: hidden; }

        /* Left Split: Decorative Grid background */
        .left-pane {
            flex: 1;
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1200&q=80') center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 4-Box Grid layout for departments/logos */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 160px);
            grid-template-rows: repeat(2, 160px);
            gap: 20px;
        }

        .grid-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .grid-box:hover { transform: translateY(-5px); }
        .grid-box.highlight { background: rgba(16, 185, 129, 0.85); }
        .grid-box h3 { font-size: 14px; font-weight: 600; line-height: 1.3; }
        .grid-box .badge { font-size: 22px; }

        /* Right Split: Login Form */
        .right-pane {
            width: 480px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
            box-shadow: -10px 0 25px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .login-card { width: 100%; max-width: 360px; margin: 0 auto; }
        .logo-header { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; }
        .logo-icon { background: #6366f1; color: white; width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .logo-header h1 { font-size: 22px; color: #1e293b; }

        .welcome-text { margin-bottom: 25px; }
        .welcome-text h2 { font-size: 20px; color: #0f172a; margin-bottom: 4px; }
        .welcome-text p { font-size: 13px; color: #64748b; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; transition: border-color 0.2s; }
        .input-group input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }

        .submit-btn { width: 100%; padding: 12px; background-color: #0f172a; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .submit-btn:hover { background-color: #1e293b; }

        .error-msg { color: #ef4444; font-size: 12px; margin-top: 12px; text-align: center; }

        @media(max-width: 900px) {
            .left-pane { display: none; }
            .right-pane { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Left Split: 4 Department / Group Logo Boxes -->
    <div class="left-pane">
        <div class="grid-container">
            <div class="grid-box highlight">
                <div class="badge">🛡️</div>
                <h3>Human Resource</h3>
            </div>
            <div class="grid-box">
                <div class="badge">📊</div>
                <h3>Complete Management</h3>
            </div>
            <div class="grid-box">
                <div class="badge">🚀</div>
                <h3>Performance & Growth</h3>
            </div>
            <div class="grid-box highlight">
                <div class="badge">💡</div>
                <h3>Inspire Teams</h3>
            </div>
        </div>
    </div>

    <!-- Right Split: Normal Login Form -->
    <div class="right-pane">
        <div class="login-card">
            <div class="logo-header">
                <div class="logo-icon">H</div>
                <h1>HRMS Portal</h1>
            </div>

            <div class="welcome-text">
                <h2>Welcome Back 👋</h2>
                <p>Please enter your credentials to access your portal</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="name@company.com" required />
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required />
                </div>

                <button type="submit" class="submit-btn">Sign In</button>
                <div id="error-msg" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Single unique initialization block
        const SUPABASE_URL = 'https://pcopzbmkvctdlsbsbshf.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AzmrbDrC6P2_FX_MU2iCKg_Yr2g3DK1';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');
            
            errorDiv.innerText = "Signing in...";

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                console.error("Login Error:", error.message);
                errorDiv.innerText = error.message;
            } else {
                console.log("Success! Redirecting...");
                window.location.href = '/dashboard.html';
            }
        });
    </script>
</body>
</html>
